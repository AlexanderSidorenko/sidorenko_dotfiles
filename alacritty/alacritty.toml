[general]
live_config_reload = true
import = ["~/.config/alacritty/dracula.toml"]

[window]
dynamic_title = true
dynamic_padding = true
decorations = "none"
startup_mode = "Maximized"
padding = { x = 8, y = 8 }

[scrolling]
history = 100000
multiplier = 3

[font]
size = 12.0

[font.normal]
family = "DroidSansM Nerd Font"
style = "Regular"

[font.bold]
family = "DroidSansM Nerd Font"
style = "Bold"

[font.italic]
family = "DroidSansM Nerd Font"
style = "Italic"

[font.bold_italic]
family = "DroidSansM Nerd Font"
style = "Bold Italic"

[cursor]
unfocused_hollow = true
thickness = 0.20

[cursor.style]
shape = "Block"
blinking = "On"

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = false

[bell]
duration = 0

# Override Dracula's background with pure black.
[colors.primary]
background = "#000000"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "CreateNewWindow"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"
