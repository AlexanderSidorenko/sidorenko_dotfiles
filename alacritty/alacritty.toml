[general]
live_config_reload = true
import = ["~/.config/alacritty/dracula.toml"]

[window]
dynamic_title = true
dynamic_padding = true
decorations = "none"
startup_mode = "Maximized"
padding = { x = 8, y = 8 }

[scrolling]
history = 100000
multiplier = 3

[font]
size = 12.0

[font.normal]
family = "DroidSansM Nerd Font"
style = "Regular"

[font.bold]
family = "DroidSansM Nerd Font"
style = "Bold"

[font.italic]
family = "DroidSansM Nerd Font"
style = "Italic"

[font.bold_italic]
family = "DroidSansM Nerd Font"
style = "Bold Italic"

[cursor]
unfocused_hollow = true
thickness = 0.20

[cursor.style]
shape = "Block"
blinking = "On"

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = false

# Open links (OSC 8 escape-sequence hyperlinks and plain-text URLs). This is
# Alacritty's STOCK default hint restated verbatim -- defining hints.enabled
# replaces the built-in array, so everything must be re-declared -- with exactly
# ONE behavioral change: mouse.mods = "Shift" (stock expects an unmodified
# hover). Inside tmux that matters: tmux captures the mouse, Alacritty's
# capture-bypass is holding Shift, and a hint only highlights when the held
# modifiers match its mods. Stock therefore can never highlight under tmux;
# with Shift it lines up -> Shift+Click opens the link. Tradeoff: Shift+Click
# is required even outside tmux (one uniform gesture). Ctrl+Shift+O is the
# keyboard route (also stock). command gets the URL as its last argument.
[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"
hyperlinks = true
post_processing = true
persist = false
command = "xdg-open"
mouse = { enabled = true, mods = "Shift" }
binding = { key = "O", mods = "Control|Shift" }

[bell]
duration = 0

# Override Dracula's background with pure black.
[colors.primary]
background = "#000000"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "CreateNewWindow"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

# Make Shift+Enter insert a newline in TUIs that read ESC+CR as a newline
# (e.g. Claude Code), instead of the Alt+Enter contortion. It sends exactly
# what Alt+Enter already emits: ESC followed by CR.
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"
