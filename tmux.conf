set -g mouse on                          # Enable mouse support for panes and windows.
set -g history-limit 100000              # Increase scrollback history size.
set -g base-index 1                       # Start window numbering at 1.
setw -g pane-base-index 1                 # Start pane numbering at 1.
set -g renumber-windows on                # Keep window numbers sequential after close.
set -g remain-on-exit failed              # Keep a pane whose process crashed or was killed (e.g. OOM) instead of vanishing; clean exits close as usual.
set -g remain-on-exit-format "Dead: #{?#{!=:#{pane_dead_status},},status #{pane_dead_status} ,}#{?#{!=:#{pane_dead_signal},},signal #{pane_dead_signal} ,}#{t:pane_dead_time} — prefix x close, prefix R respawn"
set -g allow-rename off                   # Programs can't rename windows via escape sequences.
setw -g automatic-rename on               # Auto-name windows from the format below.
setw -g automatic-rename-format "#{b:pane_current_path}:#{pane_current_command}" # dir:command; manual names (prefix ,) stay sticky.
setw -g mode-keys vi                      # Use vi keys in copy mode.
set -g status-keys vi                     # Use vi keys in the status line.
set -g set-clipboard on                   # Sync tmux yank to system clipboard.
set -g default-terminal "tmux-256color"   # Modern terminfo with full key support.
set -as terminal-overrides ",*:Tc"        # Enable truecolor where supported.
set -as terminal-features "*:hyperlinks"  # Pass OSC 8 hyperlinks through to the outer terminal (Alacritty).
set -g escape-time 20                     # Near-instant ESC for nvim mode switching.
set -g focus-events on                    # Let nvim detect pane focus changes.
unbind C-b                                # Replace default prefix.
set -g prefix C-Space                     # Ergonomic prefix that preserves C-a (readline).
bind C-Space send-prefix                  # Send literal C-Space to programs when needed.

unbind '"'                               # Remove default horizontal split binding.
unbind %                                 # Remove default vertical split binding.
bind \\ split-window -h -c "#{pane_current_path}"  # Prefix+\ for horizontal split.
bind - split-window -v -c "#{pane_current_path}"   # Prefix+- for vertical split.
bind -n M-\\ split-window -h -c "#{pane_current_path}" # Alt+\ for horizontal split.
bind -n M-- split-window -v -c "#{pane_current_path}"  # Alt+- for vertical split.
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded" # Reload config quickly.
bind R respawn-pane                      # Restart a dead pane's command in place.

bind h select-pane -L                    # Move to the left pane with h.
bind j select-pane -D                    # Move to the below pane with j.
bind k select-pane -U                    # Move to the above pane with k.
bind l select-pane -R                    # Move to the right pane with l.
bind -n M-h select-pane -L               # Move panes without prefix.
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -r H resize-pane -L 5               # Resize left by 5 columns with H.
bind -r J resize-pane -D 5               # Resize down by 5 rows with J.
bind -r K resize-pane -U 5               # Resize up by 5 rows with K.
bind -r L resize-pane -R 5               # Resize right by 5 columns with L.
bind -n M-H resize-pane -L 5             # Resize panes without prefix.
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5
bind -n M-u previous-window              # Switch windows without prefix.
bind -n M-i next-window
bind -n M-U swap-window -t -1\; select-window -t -1  # Move window left.
bind -n M-I swap-window -t +1\; select-window -t +1  # Move window right.
bind -n M-n new-window -c "#{pane_current_path}" # Create a new window without prefix.
bind -n M-1 select-window -t 1          # Jump to window by number.
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10         # Jump to window 10.
bind -n M-y switch-client -p            # Switch to previous session (by name, raw strcmp).
bind -n M-o switch-client -n            # Switch to next session (by name, raw strcmp).
# Alt+P: session/window tree picker (like prefix s). -O name sorts the picker by
# session name (raw strcmp) -- the SAME comparison switch-client -n/-p above
# cycles by -- so the picker and the cycle always agree on order. (The picker's
# default sort is creation order, which the cycle doesn't follow.) Rename a
# session (prefix S below) to reposition it in both.
bind -n M-p choose-tree -ZsO name
bind S command-prompt -I "#S" "rename-session -- '%%'" # Rename current session (prompt prefilled).

# Capture the layout to a runnable restore script on every change, so a reboot
# is undoable with `tmux-restore`. -b keeps the server from blocking on it; the
# script debounces bursts and rewrites nothing when the layout is unchanged.
# It also guards both ends of a reboot: it refuses to write when no sessions are
# left, so shutdown teardown can't clobber a good snapshot, and it refuses to
# let an automatic capture shrink a snapshot taken before the current boot, so
# the bare session you get from typing `tmux` on a fresh boot can't overwrite
# the layout you were about to restore. prefix C-s (--force) overrides both.
#
# These catch structure (sessions, windows, splits) immediately, and they also
# catch a pane starting or finishing a program -- because automatic-rename-format
# above interpolates pane_current_command, the derived name changes when the
# command does, and an automatic rename fires window-renamed exactly like an
# explicit one (measured on tmux 3.6a: arm the hook after the initial rename has
# settled, send `sleep`, and the window goes tmp:zsh -> tmp:sleep with the hook
# firing once). A Claude started mid-session therefore lands in the snapshot on
# its own, with no keypress and no shutdown capture needed.
#
# Structural events fire at once; a rename derived from the command does not.
# tmux only recomputes an automatic name on its own tick, measured at ~2s after
# the command starts while a client is attached and ~15s when the session is
# fully detached -- so a snapshot taken in the first second or two of a program
# still shows the pane at its shell.
#
# The cost of that reach is churn: every command you run rewrites the snapshot,
# which is why the shrink guard matters more than the debounce.
#
# pane-focus-out is deliberately NOT hooked. focus-events is on, so Alacritty
# reports the window losing focus and every alt-tab away from the terminal would
# fire a snapshot -- constant, and visible.
set-hook -g session-created 'run-shell -b "tmux-snapshot --quiet"'
set-hook -g session-closed 'run-shell -b "tmux-snapshot --quiet"'
set-hook -g session-renamed 'run-shell -b "tmux-snapshot --quiet"'
set-hook -g window-linked 'run-shell -b "tmux-snapshot --quiet"'
set-hook -g window-unlinked 'run-shell -b "tmux-snapshot --quiet"'
set-hook -g window-renamed 'run-shell -b "tmux-snapshot --quiet"'
set-hook -g window-layout-changed 'run-shell -b "tmux-snapshot --quiet"'
set-hook -g pane-exited 'run-shell -b "tmux-snapshot --quiet"'
bind C-s run-shell -b "tmux-snapshot --force --quiet" \; display-message "layout snapshotted" # Force a capture now.

bind -T copy-mode-vi v send -X begin-selection   # Start selection in copy mode.
bind -T copy-mode-vi y send -X copy-selection-and-cancel  # set-clipboard handles OSC 52.
bind -T copy-mode-vi r send -X rectangle-toggle  # Toggle rectangle selection.

set -g pane-active-border-style fg=yellow         # Bright border on active pane.
set -g pane-border-style fg=colour238            # Dim border on inactive panes.
set -g pane-border-lines heavy                   # Thick border lines for visibility.
set -g pane-border-status top                    # Add a status bar at the top of each pane.
set -g pane-border-format " #P: #{pane_current_command} " # Show pane number and command.
set -g window-active-style bg=terminal           # Active pane keeps normal background.
set -g window-style bg=colour235                 # Inactive panes slightly dimmed.
set -g status-interval 5                 # Refresh status line every 5 seconds.
set -g status-left-length 30             # Limit left status length.
set -g status-right-length 80            # Limit right status length.
set -g window-status-current-style bg=colour226 # Highlight active window with yellow background.
set -g status-left "#S #[fg=colour8]|"   # Show session name on the left.
set -g status-right "#(whoami)@#H #[fg=colour8]| %Y-%m-%d %H:%M" # Show user/host/time on right.

# Enter copy-mode with C-u (unless in alternate screen), then halfpage up.
bind -n C-u if-shell -F "#{alternate_on}" "send-keys C-u" "copy-mode; send-keys -X halfpage-up"
bind -n M-s copy-mode                    # Fast key to enter scroll/copy mode.
# Halfpage scrolling in copy-mode with vim-style keys.
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down
